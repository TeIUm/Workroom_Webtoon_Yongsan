<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹툰 작업실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1814; --ink-mid:#4a4540; --ink-light:#8a8480; --ink-faint:#c8c4be;
  --paper:#f7f4ef; --paper-warm:#edeae3; --paper-dark:#e0dbd2;
  --accent:#b5341c; --accent-soft:#f0e8e5; --border:#d4cfc8; --radius:4px;
  --font-serif:'Nanum Myeongjo',serif; --font-sans:'Noto Sans KR',sans-serif;
  --header-h:52px; --tab-h:42px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.7;min-height:100vh;}

/* ══════════════════════════════
   HEADER
══════════════════════════════ */
.app-header{
  background:var(--ink);color:var(--paper);
  padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;
  height:var(--header-h);position:sticky;top:0;z-index:400;
}
.app-title{font-family:var(--font-serif);font-size:17px;letter-spacing:0.08em;}
.header-actions{display:flex;gap:6px;align-items:center;}
.hbtn{
  font-family:var(--font-sans);font-size:12px;
  border:0.5px solid rgba(255,255,255,0.3);background:transparent;color:var(--paper);
  padding:5px 12px;border-radius:var(--radius);cursor:pointer;transition:background 0.15s;
}
.hbtn:hover{background:rgba(255,255,255,0.12);}
.hbtn.primary{background:var(--accent);border-color:var(--accent);}
.hbtn.primary:hover{background:#9e2a15;}

/* ══════════════════════════════
   TAB NAV
══════════════════════════════ */
.tab-nav{
  background:var(--paper-warm);border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  height:var(--tab-h);padding:0 1.5rem;gap:0;
  position:sticky;top:var(--header-h);z-index:300;
}
.tab-btn{
  font-family:var(--font-sans);font-size:13px;color:var(--ink-light);
  background:transparent;border:none;cursor:pointer;
  padding:0 18px;height:100%;
  border-bottom:2px solid transparent;
  transition:all 0.15s;display:flex;align-items:center;gap:6px;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500;}
.tab-icon{font-size:14px;}

/* ══════════════════════════════
   PAGE PANELS
══════════════════════════════ */
.page{display:none; overflow:visible;}
.page.active{display:block; overflow:visible;}
#page-synopsis{overflow:hidden;} /* 캔버스는 내부 canvas-outer가 자체 스크롤 */

/* ══════════════════════════════
   SHARED: FLOATING TOOLBAR
══════════════════════════════ */
#float-toolbar{
  position:fixed;display:none;align-items:center;gap:2px;
  background:var(--ink);border-radius:6px;padding:5px 7px;
  z-index:600;box-shadow:0 4px 16px rgba(26,24,20,0.22);white-space:nowrap;
}
#float-toolbar.visible{display:flex;}
#float-toolbar::after{
  content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid var(--ink);
}
.toolbar-btn{
  font-size:13px;font-weight:500;width:28px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border:0.5px solid transparent;border-radius:var(--radius);
  background:transparent;cursor:pointer;color:rgba(255,255,255,0.75);
  font-family:var(--font-sans);transition:all 0.1s;line-height:1;
}
.toolbar-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
.toolbar-sep{width:0.5px;height:16px;background:rgba(255,255,255,0.2);margin:0 3px;}
.hl-dot{width:10px;height:10px;border-radius:2px;display:block;}
.hl-yellow{background:#ffe066;}.hl-green{background:#b2f0c8;}
.hl-pink{background:#ffc2d4;}.hl-blue{background:#b8d8ff;}

/* ══════════════════════════════
   SHARED: RICH EDITOR
══════════════════════════════ */
.rich-editor{min-height:56px;outline:none;font-family:var(--font-sans);font-size:13px;line-height:1.75;color:var(--ink);word-break:break-word;}
.rich-editor:empty::before{content:attr(data-placeholder);color:var(--ink-faint);pointer-events:none;}
.rich-editor mark.hl-y{background:#ffe066;color:var(--ink);border-radius:2px;padding:0 1px;}
.rich-editor mark.hl-g{background:#b2f0c8;color:var(--ink);border-radius:2px;padding:0 1px;}
.rich-editor mark.hl-p{background:#ffc2d4;color:var(--ink);border-radius:2px;padding:0 1px;}
.rich-editor mark.hl-b{background:#b8d8ff;color:var(--ink);border-radius:2px;padding:0 1px;}

/* ══════════════════════════════
   SHARED: SECTION BLOCKS
══════════════════════════════ */
.section-block{background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:1rem;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--paper-warm);border-bottom:0.5px solid var(--border);}
.section-title{font-family:var(--font-serif);font-size:13px;color:var(--ink-mid);letter-spacing:0.04em;}
.two-col{display:grid;grid-template-columns:1fr 1fr;}
.sec-pane{padding:12px 16px;}
.sec-pane+.sec-pane{border-left:0.5px solid var(--border);}
.pane-label{font-size:10px;font-weight:500;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
.meta-bar-shared{display:grid;grid-template-columns:2fr 1fr 1fr;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:1rem;}
.mf{display:flex;flex-direction:column;padding:10px 16px;border-right:0.5px solid var(--border);}
.mf:last-child{border-right:none;}
.mf-label{font-size:10px;font-weight:500;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:3px;}
.mf-in{font-size:14px;border:none;background:transparent;outline:none;color:var(--ink);font-family:var(--font-sans);width:100%;}
.mf-in::placeholder{color:var(--ink-faint);}
.char-grid{display:grid;grid-template-columns:repeat(2,1fr);}
.char-card{padding:12px 16px;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);}
.char-card:nth-child(2n){border-right:none;}
.char-name-in{width:100%;font-size:14px;font-weight:500;border:none;border-bottom:0.5px solid var(--border);background:transparent;outline:none;color:var(--ink);font-family:var(--font-sans);padding-bottom:3px;margin-bottom:6px;}
.char-name-in::placeholder{color:var(--ink-faint);}
.add-char-btn{font-size:11px;color:var(--ink-light);border:0.5px dashed var(--border);border-radius:var(--radius);padding:3px 10px;background:transparent;cursor:pointer;font-family:var(--font-sans);}
.add-char-btn:hover{background:var(--paper-dark);}
.char-del{font-size:11px;color:var(--ink-faint);background:transparent;border:none;cursor:pointer;float:right;padding:2px 4px;border-radius:var(--radius);}
.char-del:hover{color:var(--accent);background:#fde8e5;}
.char-drag-handle{display:inline-flex;flex-direction:column;gap:2.5px;cursor:grab;padding:2px 4px 4px 0;float:left;margin-top:3px;opacity:0.25;transition:opacity 0.15s;}
.char-drag-handle:active{cursor:grabbing;}
.char-drag-handle span{display:block;width:14px;height:1.5px;background:var(--ink);border-radius:2px;}
.char-card:hover .char-drag-handle{opacity:0.55;}
.char-card.char-dragging{opacity:0.35;outline:2px dashed var(--border);}
.char-card.char-drag-over{outline:2px solid var(--accent);outline-offset:-2px;}
.info-panel{margin:0 auto;padding:0;}

/* ══════════════════════════════
   PAGE 1: 시놉시스 노트
══════════════════════════════ */
.canvas-toolbar{
  background:var(--paper-warm);border-bottom:0.5px solid var(--border);
  padding:6px 1.5rem;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-mid);
}
.add-note-btn{font-size:12px;color:var(--paper);background:var(--accent);border:none;border-radius:var(--radius);padding:5px 14px;cursor:pointer;font-family:var(--font-sans);}
.add-note-btn:hover{background:#9e2a15;}
.zoom-controls{display:flex;align-items:center;gap:4px;margin-left:auto;}
.zoom-btn{width:26px;height:26px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--paper);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink-mid);}
.zoom-btn:hover{background:var(--paper-dark);}
.zoom-label{font-size:12px;color:var(--ink-mid);min-width:38px;text-align:center;}
.color-palette{display:flex;gap:5px;align-items:center;}
.cp-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.12s;}
.cp-dot:hover{transform:scale(1.2);}
.cp-dot.selected{border-color:var(--ink);transform:scale(1.15);}

.canvas-outer{
  overflow:auto;
  width:100%;
  /* 고정 높이 — 내부 스크롤 전용 */
  height:calc(100vh - var(--header-h) - var(--tab-h) - 40px);
  min-height:400px;
  cursor:default;
  display:block;
  /* 스크롤바 항상 표시 */
  scrollbar-width:thin;
  scrollbar-color:var(--ink-faint) var(--paper-warm);
}
.canvas-outer::-webkit-scrollbar{width:10px;height:10px;}
.canvas-outer::-webkit-scrollbar-track{background:var(--paper-warm);}
.canvas-outer::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:5px;}
.canvas-outer::-webkit-scrollbar-corner{background:var(--paper-warm);}
.canvas-inner{
  position:relative;
  /* 초기 크기: JS setZoom이 덮어씀 */
  width:3200px; height:2400px;
  background-color:var(--paper);
  background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);
  background-size:28px 28px;
  flex-shrink:0;
}
.postit{
  position:absolute;
  width:220px; min-height:160px;
  border-radius:6px;
  box-shadow:2px 3px 10px rgba(26,24,20,0.13);
  display:flex;flex-direction:column;
  cursor:grab;user-select:none;
  z-index:20;transition:box-shadow 0.15s;
  overflow:hidden;
}
.postit:hover{box-shadow:4px 6px 18px rgba(26,24,20,0.18);z-index:25;}
.postit.dragging-note{cursor:grabbing;box-shadow:8px 12px 28px rgba(26,24,20,0.22);z-index:50;}
.postit-head{padding:8px 10px 6px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;filter:brightness(0.9);flex-shrink:0;}
.postit-title{flex:1;font-size:13px;font-weight:500;border:none;background:transparent;outline:none;color:var(--ink);font-family:var(--font-sans);cursor:text;}
.postit-title::placeholder{color:rgba(26,24,20,0.3);}
.postit-del{font-size:11px;color:rgba(26,24,20,0.35);background:transparent;border:none;cursor:pointer;padding:1px 4px;border-radius:var(--radius);flex-shrink:0;line-height:1;}
.postit-del:hover{color:var(--accent);background:rgba(255,255,255,0.4);}
.postit-body{flex:1;padding:8px 10px 4px;display:flex;flex-direction:column;overflow:hidden;}
.postit-note{
  flex:1;width:100%;min-height:60px;
  border:none;background:transparent;outline:none;
  font-family:var(--font-sans);font-size:12px;line-height:1.65;color:var(--ink);
  cursor:text;word-break:break-word;overflow-y:auto;
}
.postit-note:empty::before{content:attr(data-placeholder);color:rgba(26,24,20,0.3);pointer-events:none;}
/* 포스트잇 하단 바: 색상 + 폰트 크기 + 리사이즈 */
.postit-footer{display:flex;align-items:center;padding:4px 8px 6px;gap:6px;flex-shrink:0;}
.note-colors{display:flex;gap:3px;align-items:center;}
.nc-dot{width:11px;height:11px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;flex-shrink:0;}
.nc-dot:hover{transform:scale(1.25);}
.nc-dot.on{border-color:var(--ink);}
.font-ctrl{display:flex;align-items:center;gap:2px;margin-left:auto;}
.font-btn{width:20px;height:20px;font-size:11px;border:0.5px solid rgba(26,24,20,0.2);border-radius:3px;background:rgba(255,255,255,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-mid);line-height:1;flex-shrink:0;}
.font-btn:hover{background:rgba(255,255,255,0.8);}
.font-size-label{font-size:10px;color:var(--ink-light);min-width:22px;text-align:center;}
/* 리사이즈 핸들 */
.resize-handle{
  position:absolute;right:0;bottom:0;
  width:14px;height:14px;cursor:se-resize;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:2px;opacity:0.35;
}
.resize-handle::before{
  content:'';display:block;
  width:8px;height:8px;
  border-right:2px solid var(--ink-mid);
  border-bottom:2px solid var(--ink-mid);
  border-radius:0 0 2px 0;
}

/* ══════════════════════════════
   PAGE 2: 플롯 구상도
══════════════════════════════ */
.plot-main{margin:0;padding:0;}
#synopsis-info-slot{padding:1.5rem 2rem 0;}
#plot-info-slot{padding:1.5rem 2rem 0;}
.plot-ev-wrap{padding:0 2rem 2rem;}
.ev-list{display:flex;flex-direction:column;gap:12px;}
.ev-card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.ev-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper-warm);border-bottom:0.5px solid var(--border);}
.ev-num{font-family:var(--font-serif);font-size:13px;color:var(--ink-faint);min-width:32px;}
.ev-title-in{flex:1;font-size:14px;font-weight:500;border:none;background:transparent;outline:none;color:var(--ink);font-family:var(--font-sans);}
.ev-title-in::placeholder{color:var(--ink-faint);}
.ev-del{font-size:12px;color:var(--ink-faint);background:transparent;border:none;cursor:pointer;padding:2px 6px;border-radius:var(--radius);}
.ev-del:hover{color:var(--accent);background:#fde8e5;}
.ev-body{display:grid;grid-template-columns:1fr 2fr;}
.ev-pane{padding:12px 14px;}
.ev-pane+.ev-pane{border-left:0.5px solid var(--border);}
.add-ev-btn{width:100%;padding:12px;margin-top:4px;font-family:var(--font-sans);font-size:13px;color:var(--ink-mid);background:transparent;border:1px dashed var(--border);border-radius:8px;cursor:pointer;transition:all 0.12s;}
.add-ev-btn:hover{background:var(--paper-warm);border-style:solid;}

/* ══════════════════════════════
   PAGE 3: 웹툰 글 콘티
══════════════════════════════ */
.conti-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - var(--header-h) - var(--tab-h));}
.sidebar{background:var(--paper-warm);border-right:1px solid var(--border);padding:1.5rem 1rem;position:sticky;top:calc(var(--header-h) + var(--tab-h));height:calc(100vh - var(--header-h) - var(--tab-h));overflow-y:auto;}
.sidebar-section{margin-bottom:1.5rem;}
.sidebar-label{font-size:10px;font-weight:500;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;padding-bottom:4px;border-bottom:0.5px solid var(--border);}
.s-meta-field{margin-bottom:10px;}
.s-meta-field label{font-size:11px;color:var(--ink-light);display:block;margin-bottom:3px;}
.s-meta-field input,.s-meta-field textarea{width:100%;background:var(--paper);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 8px;font-family:var(--font-sans);font-size:13px;color:var(--ink);outline:none;}
.s-meta-field textarea{resize:vertical;min-height:60px;}
.ep-nav{display:flex;flex-direction:column;gap:4px;}
.ep-item{padding:7px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;border:0.5px solid transparent;transition:all 0.12s;display:flex;justify-content:space-between;align-items:center;}
.ep-item:hover{background:var(--paper-dark);border-color:var(--border);}
.ep-item.active{background:var(--ink);color:var(--paper);}
.ep-item .ep-del{font-size:11px;opacity:0.4;cursor:pointer;}
.ep-item:hover .ep-del{opacity:1;}
.ep-item.active .ep-del{opacity:0.5;color:var(--paper);}
.add-ep-btn{width:100%;padding:7px;font-family:var(--font-sans);font-size:12px;color:var(--ink-mid);background:transparent;border:0.5px dashed var(--border);border-radius:var(--radius);cursor:pointer;transition:all 0.12s;margin-top:4px;}
.add-ep-btn:hover{background:var(--paper-dark);border-style:solid;}
.conti-main{padding:2rem;max-width:860px;}
.ep-header-bar{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
.ep-num-badge{font-family:var(--font-serif);font-size:36px;line-height:1;color:var(--ink-faint);min-width:60px;}
.ep-meta{flex:1;}
.ep-title-input{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--ink);border:none;background:transparent;outline:none;width:100%;margin-bottom:4px;}
.ep-title-input::placeholder{color:var(--ink-faint);}
.ep-summary-input{font-family:var(--font-sans);font-size:13px;color:var(--ink-mid);border:none;background:transparent;outline:none;width:100%;}
.ep-summary-input::placeholder{color:var(--ink-faint);}
.cut-block{border:1px solid var(--border);border-radius:6px;margin-bottom:14px;background:#fff;transition:box-shadow 0.15s;}
.cut-block:hover{box-shadow:0 2px 12px rgba(26,24,20,0.08);}
.cut-block.dragging{opacity:0.4;box-shadow:0 8px 24px rgba(26,24,20,0.18);}
.cut-block.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.cut-head{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--paper-warm);border-bottom:0.5px solid var(--border);border-radius:6px 6px 0 0;}
.drag-handle{cursor:grab;padding:0 2px;line-height:1;user-select:none;display:flex;flex-direction:column;gap:2px;align-items:center;}
.drag-handle:active{cursor:grabbing;}
.drag-handle span{display:block;width:12px;height:1.5px;background:var(--ink-faint);border-radius:2px;}
.cut-badge{font-family:var(--font-serif);font-size:12px;font-weight:700;color:var(--ink);min-width:44px;}
.cut-select{font-family:var(--font-sans);font-size:12px;color:var(--ink-mid);border:0.5px solid var(--border);border-radius:var(--radius);padding:3px 8px;background:var(--paper);outline:none;cursor:pointer;}
.mood-badge{font-size:11px;padding:2px 10px;border-radius:99px;border:0.5px solid var(--border);}
.mood-badge.조용{background:#e8f0f8;color:#2a5a8a;border-color:#b0cce8;}
.mood-badge.보통{background:var(--paper-warm);color:var(--ink-mid);}
.mood-badge.긴장{background:#fde8e8;color:#8a2020;border-color:#e8b0b0;}
.mood-badge.코믹{background:#fef8e0;color:#8a6a00;border-color:#e8d888;}
.mood-badge.감동{background:#e8f5e8;color:#1a6a2a;border-color:#a0d8a8;}
.mood-badge.반전{background:#f0e8f8;color:#5a1a8a;border-color:#c8a0e8;}
.cut-del-btn{margin-left:auto;font-size:11px;color:var(--ink-faint);background:transparent;border:none;cursor:pointer;padding:2px 4px;}
.cut-del-btn:hover{color:var(--accent);}
.cut-body{display:grid;grid-template-columns:1fr 1fr;}
.cut-pane{padding:12px 14px;}
.cut-pane+.cut-pane{border-left:0.5px solid var(--border);}
.scene-textarea{width:100%;border:none;background:transparent;outline:none;font-family:var(--font-sans);font-size:13px;line-height:1.7;color:var(--ink);resize:none;min-height:80px;}
.dialog-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.dialog-row{display:flex;gap:6px;align-items:flex-start;}
.d-char{font-size:12px;font-weight:500;color:var(--ink-mid);border:none;background:transparent;outline:none;font-family:var(--font-sans);width:58px;min-width:58px;border-bottom:0.5px solid var(--border);padding-bottom:1px;margin-top:1px;}
.d-text{flex:1;border:none;background:transparent;outline:none;font-family:var(--font-serif);font-size:13px;line-height:1.65;color:var(--ink);resize:none;}
.d-type{font-size:10px;color:var(--ink-light);border:0.5px solid var(--border);border-radius:99px;padding:2px 7px;background:transparent;cursor:pointer;font-family:var(--font-sans);outline:none;white-space:nowrap;margin-top:2px;}
.add-dlg{font-size:11px;color:var(--ink-light);border:0.5px dashed var(--border);border-radius:var(--radius);padding:3px 10px;background:transparent;cursor:pointer;font-family:var(--font-sans);}
.add-dlg:hover{background:var(--paper-warm);}

<script>
// ══════════════════════════════════════
// TAB SWITCHING — 공유 섹션 DOM 이동
// ══════════════════════════════════════
let currentTab = 'synopsis';

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  currentTab = tab;

  // 공유 섹션을 현재 탭 슬롯으로 이동
  const shared = document.getElementById('shared-info');
  if (tab === 'synopsis') {
    document.getElementById('synopsis-info-slot').appendChild(shared);
  } else if (tab === 'plot') {
    document.getElementById('plot-info-slot').appendChild(shared);
  }
  // conti 탭은 shared-info 숨김
  shared.style.display = (tab === 'conti') ? 'none' : '';
}

// ══════════════════════════════════════
// FLOATING TOOLBAR (shared)
// ══════════════════════════════════════
const FT = document.getElementById('float-toolbar');
let activeEditor = null;

function showFT() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideFT(); return; }
  const range = sel.getRangeAt(0);
  const anc = range.commonAncestorContainer;
  const editor = anc.nodeType===1 ? anc.closest('.rich-editor') : anc.parentElement?.closest('.rich-editor');
  if (!editor) { hideFT(); return; }
  activeEditor = editor;
  const rect = range.getBoundingClientRect();
  const ftW = 220;
  let left = rect.left + rect.width/2 - ftW/2;
  left = Math.max(8, Math.min(left, window.innerWidth - ftW - 8));
  FT.style.left = left+'px';
  FT.style.top = (rect.top - 44)+'px';
  FT.style.width = ftW+'px';
  FT.classList.add('visible');
}
function hideFT() { FT.classList.remove('visible'); activeEditor = null; }
function ft(cmd) { event.preventDefault(); document.execCommand(cmd); setTimeout(showFT,10); }
function fhl(cls) {
  event.preventDefault();
  if (!activeEditor) return;
  const sel = window.getSelection();
  if (cls===null) {
    document.execCommand('removeFormat');
    activeEditor.querySelectorAll('mark').forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);});
    hideFT(); return;
  }
  if (!sel||sel.isCollapsed||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  const mark=document.createElement('mark'); mark.className=cls;
  try{range.surroundContents(mark);}catch(e){const f=range.extractContents();mark.appendChild(f);range.insertNode(mark);}
  sel.removeAllRanges(); hideFT();
}
document.addEventListener('mouseup', e=>{if(FT.contains(e.target))return;setTimeout(showFT,10);});
document.addEventListener('keyup', e=>{if(e.shiftKey)setTimeout(showFT,10);});
document.addEventListener('mousedown', e=>{if(!FT.contains(e.target)&&!e.target.closest('.rich-editor'))hideFT();});
document.addEventListener('selectionchange', ()=>{const s=window.getSelection();if(s&&s.isCollapsed)hideFT();});

// ══════════════════════════════════════
// SYNOPSIS — CANVAS & ZOOM
// ══════════════════════════════════════
const NOTE_COLORS=[
  {id:'yellow',bg:'#FFF9C4',label:'노랑'},{id:'peach',bg:'#FFE0B2',label:'살구'},
  {id:'pink',bg:'#FCE4EC',label:'분홍'},{id:'green',bg:'#DCEDC8',label:'연초록'},
  {id:'blue',bg:'#BBDEFB',label:'하늘'},{id:'lavender',bg:'#E8EAF6',label:'라벤더'},
  {id:'white',bg:'#FFFFFF',label:'흰색'},
];
let selectedColor='yellow';
let canvasZoom=1;
let noteIdCounter=0;

function renderPalette() {
  const p=document.getElementById('color-palette');
  p.innerHTML=NOTE_COLORS.map(c=>`
    <div class="cp-dot ${selectedColor===c.id?'selected':''}"
      style="background:${c.bg};border-color:${selectedColor===c.id?'var(--ink)':'rgba(0,0,0,0.15)'}"
      title="${c.label}" onclick="selectColor('${c.id}')"></div>
  `).join('');
}
function selectColor(id){selectedColor=id;renderPalette();}

const BASE_W=6400, BASE_H=4800;

function setZoom(z){
  const prev=canvasZoom;
  canvasZoom=Math.min(2, Math.max(0.3, parseFloat(z.toFixed(1))));
  const inner=document.getElementById('canvas-inner');
  // 캔버스 크기만 조절 → 가로·세로 스크롤바 정상 작동
  inner.style.width=(BASE_W*canvasZoom)+'px';
  inner.style.height=(BASE_H*canvasZoom)+'px';
  // 격자 점 크기도 비례
  const gs=Math.round(28*canvasZoom);
  inner.style.backgroundSize=gs+'px '+gs+'px';
  // 노트 위치만 이동 (크기는 고정 220px 유지)
  inner.querySelectorAll('.postit').forEach(el=>{
    const rx=parseFloat(el.dataset.ox)||0;
    const ry=parseFloat(el.dataset.oy)||0;
    el.style.left=(rx*canvasZoom)+'px';
    el.style.top=(ry*canvasZoom)+'px';
  });
  document.getElementById('zoom-label').textContent=Math.round(canvasZoom*100)+'%';
}

// 마우스 휠 줌 (Ctrl+wheel)
document.getElementById('canvas-outer').addEventListener('wheel', e=>{
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(canvasZoom + (e.deltaY<0?0.1:-0.1));
},{passive:false});

// ── 캔버스 배경 드래그로 패닝 ──
(function(){
  const outer = document.getElementById('canvas-outer');
  let panning=false, startX=0, startY=0, scrollX=0, scrollY=0;

  outer.addEventListener('mousedown', e=>{
    // 포스트잇이나 그 내부 요소 클릭이면 패닝 안 함
    if(e.target.closest('.postit')) return;
    panning=true;
    startX=e.clientX; startY=e.clientY;
    scrollX=outer.scrollLeft; scrollY=outer.scrollTop;
    outer.style.cursor='grabbing';
    e.preventDefault();
  });

  window.addEventListener('mousemove', e=>{
    if(!panning) return;
    outer.scrollLeft = scrollX - (e.clientX - startX);
    outer.scrollTop  = scrollY - (e.clientY - startY);
  });

  window.addEventListener('mouseup', ()=>{
    if(!panning) return;
    panning=false;
    outer.style.cursor='default';
  });
})();

function getColorBg(id){return NOTE_COLORS.find(c=>c.id===id)?.bg||'#FFF9C4';}

function addNote(data) {
  noteIdCounter++;
  const id=data?.id||('note-'+noteIdCounter);
  const colorId=data?.color||selectedColor;
  const bg=getColorBg(colorId);
  const outer=document.getElementById('canvas-outer');
  // 원본(zoom=1 기준) 좌표
  const rawX=data?.x??(outer.scrollLeft/canvasZoom+80+Math.random()*400);
  const rawY=data?.y??(outer.scrollTop/canvasZoom+80+Math.random()*280);
  const rawW=data?.w||220;
  const rawH=data?.h||180;
  const fontSize=data?.fontSize||12;
  const el=document.createElement('div');
  el.className='postit'; el.id=id;
  el.style.left=(rawX*canvasZoom)+'px';
  el.style.top=(rawY*canvasZoom)+'px';
  el.style.width=rawW+'px';
  el.style.height=rawH+'px';
  el.style.minHeight='unset';
  el.dataset.ox=rawX; el.dataset.oy=rawY;
  el.dataset.ow=rawW; el.dataset.oh=rawH;
  el.dataset.colorId=colorId;
  el.style.background=bg;
  const dots=NOTE_COLORS.map(c=>`<div class="nc-dot ${c.id===colorId?'on':''}" style="background:${c.bg}" title="${c.label}" onclick="changeNoteColor('${id}','${c.id}',this)"></div>`).join('');
  el.innerHTML=`
    <div class="postit-head">
      <input class="postit-title" placeholder="제목" value="${esc(data?.title||'')}" oninput="saveAll()"/>
      <button class="postit-del" onclick="deleteNote('${id}')">✕</button>
    </div>
    <div class="postit-body">
      <div class="postit-note rich-editor" contenteditable="true"
        data-placeholder="아이디어를 자유롭게 적어요…"
        style="font-size:${fontSize}px;"></div>
    </div>
    <div class="postit-footer">
      <div class="note-colors">${dots}</div>
      <div class="font-ctrl">
        <button class="font-btn" onclick="changeNoteFont('${id}',-1)">−</button>
        <span class="font-size-label" id="fs-${id}">${fontSize}</span>
        <button class="font-btn" onclick="changeNoteFont('${id}',1)">＋</button>
      </div>
    </div>
    <div class="resize-handle" id="rh-${id}"></div>
  `;
  document.getElementById('canvas-inner').appendChild(el);
  const noteEl=el.querySelector('.postit-note');
  if(data?.body) noteEl.innerHTML=data.body;
  noteEl.addEventListener('input',saveAll);
  initNoteDrag(el);
  initNoteResize(el);
}

function changeNoteFont(id,delta){
  const el=document.getElementById(id); if(!el)return;
  const note=el.querySelector('.postit-note'); if(!note)return;
  const cur=parseInt(note.style.fontSize)||12;
  const next=Math.min(24,Math.max(9,cur+delta));
  note.style.fontSize=next+'px';
  const lbl=document.getElementById('fs-'+id);
  if(lbl)lbl.textContent=next;
  saveAll();
}

function changeNoteColor(noteId,colorId,dotEl){
  const el=document.getElementById(noteId); if(!el)return;
  el.style.background=getColorBg(colorId);
  el.dataset.colorId=colorId;
  el.querySelectorAll('.nc-dot').forEach(d=>d.classList.remove('on'));
  dotEl.classList.add('on'); saveAll();
}
function deleteNote(id){document.getElementById(id)?.remove();saveAll();}

function initNoteDrag(el){
  let startX,startY,origRawX,origRawY,dragging=false;
  el.addEventListener('mousedown',e=>{
    if(e.target.closest('input,.postit-note,button,.note-colors,.font-ctrl,.resize-handle'))return;
    e.preventDefault(); dragging=true;
    el.classList.add('dragging-note');
    startX=e.clientX; startY=e.clientY;
    origRawX=parseFloat(el.dataset.ox)||0;
    origRawY=parseFloat(el.dataset.oy)||0;
    function onMove(e){
      if(!dragging)return;
      const newRawX=Math.max(0,origRawX+(e.clientX-startX)/canvasZoom);
      const newRawY=Math.max(0,origRawY+(e.clientY-startY)/canvasZoom);
      el.dataset.ox=newRawX; el.dataset.oy=newRawY;
      el.style.left=(newRawX*canvasZoom)+'px';
      el.style.top=(newRawY*canvasZoom)+'px';
    }
    function onUp(){
      dragging=false; el.classList.remove('dragging-note');
      saveAll();
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  });
}

function initNoteResize(el){
  const handle=el.querySelector('.resize-handle'); if(!handle)return;
  let startX,startY,origW,origH,resizing=false;
  handle.addEventListener('mousedown',e=>{
    e.preventDefault(); e.stopPropagation();
    resizing=true;
    startX=e.clientX; startY=e.clientY;
    origW=el.offsetWidth; origH=el.offsetHeight;
    el.style.transition='none';
    function onMove(e){
      if(!resizing)return;
      const newW=Math.max(160,origW+(e.clientX-startX));
      const newH=Math.max(140,origH+(e.clientY-startY));
      el.style.width=newW+'px';
      el.style.height=newH+'px';
      el.dataset.ow=newW; el.dataset.oh=newH;
    }
    function onUp(){
      resizing=false; el.style.transition='';
      saveAll();
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  });
}

// ── 공유 인물 (synopsis + plot 동일) ──
let sharedCharCount=0;
function sharedAddChar(data){
  sharedCharCount++;
  const n=sharedCharCount;
  const grid=document.getElementById('shared-char-grid');
  const div=document.createElement('div'); div.className='char-card'; div.id='shared-char-'+n;
  const descId='shared-cdesc-'+n;
  div.innerHTML=`
    <button class="char-del" onclick="sharedDelChar(${n})">✕</button>
    <div class="char-drag-handle" title="드래그로 순서 변경"><span></span><span></span><span></span></div>
    <input class="char-name-in" id="shared-cname-${n}" placeholder="이름" value="${esc(data?.name||'')}" oninput="saveAll()"/>

// 인물 카드 드래그 순서 변경
let charDragSrc=null;
function initCharDrag(card){
  card.setAttribute('draggable','true');
  card.addEventListener('dragstart',e=>{
    if(e.target.closest('input,.rich-editor,button'))return;
    charDragSrc=card; card.classList.add('char-dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','');
  });
  card.addEventListener('dragend',()=>{
    card.classList.remove('char-dragging');
    document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('char-drag-over'));
    charDragSrc=null; saveAll();
  });
  card.addEventListener('dragover',e=>{
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    if(charDragSrc&&charDragSrc!==card){
      document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('char-drag-over'));
      card.classList.add('char-drag-over');
    }
  });
  card.addEventListener('dragleave',()=>card.classList.remove('char-drag-over'));
  card.addEventListener('drop',e=>{
    e.preventDefault(); if(!charDragSrc||charDragSrc===card)return;
    card.classList.remove('char-drag-over');
    const grid=document.getElementById('shared-char-grid');
    const cards=[...grid.querySelectorAll('.char-card')];
    const si=cards.indexOf(charDragSrc), ti=cards.indexOf(card);
    si<ti ? grid.insertBefore(charDragSrc,card.nextSibling) : grid.insertBefore(charDragSrc,card);
  });
}

let dragSrc=null;
function initDragOnCut(block){
  block.setAttribute('draggable','true');

const GDRIVE_CLIENT_ID = '1083594140388-j6ahktejijqmmbq93uq22191piqqf9v4.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GDRIVE_FILENAME = 'webtoon-workspace.json';

let gdriveToken = null;
let gdriveFileId = null; // Drive에 저장된 파일 ID 캐시

function gdriveInit() {
  // GIS(Google Identity Services) 로드 후 로그인 버튼 표시
  if (typeof google === 'undefined') {
    setTimeout(gdriveInit, 500); return;
  }
  document.getElementById('btn-signin').style.display = '';
  // 이전 토큰 복원 시도
  const saved = localStorage.getItem('gdrive-token');
  if (saved) {
    gdriveToken = saved;
    gdriveOnSignedIn();
  }
}

function gdriveSignIn() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error) { showToast('로그인 실패: ' + resp.error); return; }
      gdriveToken = resp.access_token;
      localStorage.setItem('gdrive-token', gdriveToken);
      gdriveOnSignedIn();
    }
  });
  client.requestAccessToken();
}

function gdriveOnSignedIn() {
  document.getElementById('btn-signin').style.display = 'none';
  document.getElementById('btn-gdrive-save').style.display = '';
  document.getElementById('btn-gdrive-load').style.display = '';
  document.getElementById('gdrive-status').textContent = '☁️ Drive 연결됨';
  showToast('Google Drive 연결됐어요!');
}

// Drive에서 기존 파일 ID 검색
async function gdriveFindFile() {
  if (gdriveFileId) return gdriveFileId;
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${GDRIVE_FILENAME}' and trashed=false&fields=files(id,name)`,
    { headers: { Authorization: 'Bearer ' + gdriveToken } }
  );
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    gdriveFileId = data.files[0].id;
    return gdriveFileId;
  }
  return null;
}

// Drive에 저장
async function gdriveSave() {
  if (!gdriveToken) { gdriveSignIn(); return; }
  syncWorkMeta(); if (contiState.currentEpId) syncCurrentEpisode();
  const content = JSON.stringify(collectAll(), null, 2);
  const blob = new Blob([content], { type: 'application/json' });

  try {
    showToast('Drive에 저장 중…');
    const fileId = await gdriveFindFile();
    let res;
    if (fileId) {
      // 기존 파일 업데이트
      res = await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
        { method: 'PATCH', headers: { Authorization: 'Bearer ' + gdriveToken, 'Content-Type': 'application/json' }, body: blob }
      );
    } else {
      // 신규 파일 생성 (multipart)
      const meta = JSON.stringify({ name: GDRIVE_FILENAME, mimeType: 'application/json' });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', blob);
      res = await fetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        { method: 'POST', headers: { Authorization: 'Bearer ' + gdriveToken }, body: form }
      );
      const created = await res.json();
      gdriveFileId = created.id;
    }
    if (res.ok) { showToast('☁️ Drive에 저장됐어요!'); }
    else { showToast('저장 실패, 다시 시도해주세요'); }
  } catch(e) { showToast('오류: ' + e.message); }
}

// Drive에서 불러오기
async function gdriveLoad() {
  if (!gdriveToken) { gdriveSignIn(); return; }
  try {
    showToast('Drive에서 불러오는 중…');
    const fileId = await gdriveFindFile();
    if (!fileId) { showToast('Drive에 저장된 파일이 없어요'); return; }
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
      { headers: { Authorization: 'Bearer ' + gdriveToken } }
    );
    const data = await res.json();
    if (!confirm('현재 작업을 Drive 데이터로 덮어씁니다. 계속할까요?')) return;
    loadAll(data);
    saveAll();
    showToast('☁️ Drive에서 불러왔어요!');
  } catch(e) { showToast('불러오기 실패: ' + e.message); }
}

function handleImport(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!confirm('현재 작업을 덮어씁니다. 계속할까요?'))return;
      loadAll(d); saveAll(); showToast('불러오기 완료');
    }catch{showToast('파일 오류: JSON 형식을 확인하세요');}
  };
  reader.readAsText(file); e.target.value='';
}
function exportCurrentTXT(){
  syncWorkMeta(); if(contiState.currentEpId)syncCurrentEpisode();
  const d=collectAll();
  let lines=[];
  if(currentTab==='synopsis'){
    const sh=d.shared; const s=d.synopsis;
    lines.push(`■ ${sh.title||'(제목 없음)'}  |  장르: ${sh.genre||'-'}  |  글: ${sh.author||'-'}`,'');
    if(sh.bgSpace||sh.bgWorld){lines.push('[ 배경 ]');if(sh.bgSpace)lines.push('  · 공간: '+strip(sh.bgSpace));if(sh.bgWorld)lines.push('  · 세계관: '+strip(sh.bgWorld));lines.push('');}
    if(sh.chars?.length){lines.push('[ 인물 ]');sh.chars.forEach(c=>{if(c.name||c.desc)lines.push('  · '+(c.name||'?')+' — '+strip(c.desc));});lines.push('');}
    lines.push('[ 아이디어 노트 ]');
    s.notes.forEach((n,i)=>{lines.push('\n[노트 '+(i+1)+'] '+(n.title||'(제목 없음)'));if(n.body)lines.push(n.body);});
    download(lines.join('\n'),(sh.title||'synopsis')+'-synopsis.txt','text/plain');
  } else if(currentTab==='plot'){
    const sh=d.shared; const p=d.plot;
    lines.push(`■ ${sh.title||'(제목 없음)'}  |  장르: ${sh.genre||'-'}  |  글: ${sh.author||'-'}`,'');
    if(sh.bgSpace||sh.bgWorld){lines.push('[ 배경 ]');if(sh.bgSpace)lines.push('  · 공간: '+strip(sh.bgSpace));if(sh.bgWorld)lines.push('  · 세계관: '+strip(sh.bgWorld));lines.push('');}
    if(sh.chars?.length){lines.push('[ 인물 ]');sh.chars.forEach(c=>{if(c.name||c.desc)lines.push('  · '+(c.name||'?')+' — '+strip(c.desc));});lines.push('');}
    p.events.forEach((ev,i)=>{
      lines.push('─'.repeat(40),'[사건 '+(i+1)+'] '+(ev.title||'(제목 없음)'));
      if(ev.memo)lines.push('▷ 메모:\n'+strip(ev.memo));
      if(ev.story)lines.push('▷ 줄거리:\n'+strip(ev.story));
      lines.push('');
    });
    download(lines.join('\n'),(sh.title||'plot')+'-plot.txt','text/plain');
  } else {
    const st=d.conti;
    lines.push(`■ ${st.title||'(제목 없음)'}  |  장르: ${st.genre||'-'}  |  글: ${st.author||'-'}`,'');
    st.episodes.forEach(ep=>{
      lines.push('='.repeat(50),'['+ep.num+'화] '+(ep.title||'(제목 없음)'));
      if(ep.summary)lines.push('요약: '+ep.summary); lines.push('');
      (ep.cuts||[]).forEach((c,i)=>{
        lines.push('── 컷 '+(i+1)+'  ['+c.size+'] ['+c.mood+']');
        if(c.scene)lines.push('▶ 지문: '+c.scene);
        (c.dialogs||[]).forEach(dl=>{if(dl.text)lines.push('  '+(dl.char||'?')+' ('+dl.type+'): '+dl.text);});
        if(c.note)lines.push('  ✎ 연출: '+c.note); lines.push('');
      });
    });
    download(lines.join('\n'),(st.title||'conti')+'-conti.txt','text/plain');
  }
}

// ── Utils ──
function strip(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent||'';}
function download(content,filename,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=filename;a.click();}
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ── Init ──
window.addEventListener('DOMContentLoaded',()=>{
  renderPalette();
  gdriveInit();
  // 공유 섹션 이벤트
  ['shared-bg-space','shared-bg-world'].forEach(id=>{
    document.getElementById(id)?.addEventListener('input',saveAll);
  });
  // 초기 슬롯 배치
  document.getElementById('synopsis-info-slot').appendChild(document.getElementById('shared-info'));

  const saved=localStorage.getItem('webtoon-workspace-v1');
  if(saved){try{loadAll(JSON.parse(saved));return;}catch(e){}}
  // 기본값
  sharedAddChar(); sharedAddChar();
  addNote(); addNote(); addNote();
  addEvent(); addEvent(); addEvent();
  setZoom(1);
});

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveAll();}
});
